name: build-ipa

# 全自动编译：push 到 main 或手动 Run workflow，产出未签名 ipa 作为 artifact
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 环境自检
        run: |
          ls /Applications | grep -i '^Xcode' || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: 编译（先用工程默认部署目标 iOS 27）
        id: build1
        continue-on-error: true
        run: |
          set -euo pipefail
          xcodebuild -project "Film Camera.xcodeproj" -target "Film Camera" \
            -configuration Release -sdk iphoneos -arch arm64 \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build" build

      - name: 兜底——部署目标降到 iOS 26 再编一次
        if: steps.build1.outcome == 'failure'
        run: |
          set -euo pipefail
          /usr/bin/sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 27.0;/IPHONEOS_DEPLOYMENT_TARGET = 26.0;/g' "Film Camera.xcodeproj/project.pbxproj"
          grep -m3 IPHONEOS_DEPLOYMENT_TARGET "Film Camera.xcodeproj/project.pbxproj" || true
          xcodebuild -project "Film Camera.xcodeproj" -target "Film Camera" \
            -configuration Release -sdk iphoneos -arch arm64 \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build" build

      - name: 打包成 ipa
        run: |
          set -euo pipefail
          APP=$(find build -maxdepth 2 -name "*.app" | head -1)
          echo "app=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry FilmCamera-unsigned.ipa Payload
          ls -lh FilmCamera-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FilmCamera-unsigned-ipa
          path: FilmCamera-unsigned.ipa
          if-no-files-found: error
